<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= 는 크롬의 파비콘 캐시를 끊기 위한 것이다. 크롬은 파비콘을 주소마다 따로
         기억해서, 파일 속만 바꾸면 창 제목줄에 옛 그림이 계속 남는다(실제로 그랬다).
         아이콘을 바꿀 때마다 이 숫자를 올린다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <!-- viewport-fit=cover: 아이패드 홈화면에서 띄우면 화면 끝까지 쓴다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IV-story</title>

    <!-- 홈 화면에 추가하면 주소창·탭 없이 독립 창으로 뜬다(브라우저인 게 안 보인다). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IV-story" />
    <!-- 상태바를 앱 배경에 녹인다. 라이트/다크 각각 --surface-bg 값. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2eee4" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
